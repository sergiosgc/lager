[package]
name = "toasty-schema-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Throwaway spike for #5: can Toasty map lager's frozen SQLite schema?"

[dependencies]
toasty = { version = "=0.11.0", features = ["sqlite"] }
toasty-driver-sqlite = "=0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
